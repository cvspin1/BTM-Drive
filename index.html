<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BTM DRIVE — Location de voiture de luxe et économique à Casablanca</title>
<meta name="description" content="BTM DRIVE : location de voiture de luxe et économique à Casablanca (Sidi Bernoussi). Service fiable, assistance 7j/7.">
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080a;--surf:#121214;--surf2:#18181b;--line:#2a2a2f;--ink:#f3f3f1;--mut:#8f8f98;--gold:#FFB400;--hot:#ff3d00;--wa:#25D366;color-scheme:dark;--cut:polygon(0 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px;background:var(--bg)}
body{margin:0;font:16px/1.6 Barlow,system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden}
h1,h2,h3,.brand{font-family:Oswald,Impact,sans-serif;text-transform:uppercase;line-height:1;letter-spacing:.01em;font-weight:700}
h2{font-size:clamp(2.2rem,6vw,3.6rem);margin:0 0 .6rem}
h2::before{content:"";display:inline-block;width:.5em;height:.14em;background:var(--gold);margin-inline-end:.35em;vertical-align:middle;transform:skewX(-30deg)}
a{color:inherit}:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.sub{color:var(--mut);margin:0 0 2rem;max-width:36em}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:1rem;padding:.55rem 1.25rem;background:rgba(8,8,10,.88);backdrop-filter:blur(12px);border-bottom:2px solid var(--gold)}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;margin-inline-end:auto;font-size:1.4rem}
.brand img{height:44px;width:44px;border-radius:50%;box-shadow:0 0 0 2px var(--gold)}.brand b{color:var(--gold)}
.bar nav{display:none;gap:1.6rem;font:600 .95rem Oswald;text-transform:uppercase;letter-spacing:.08em}.bar nav a{text-decoration:none;color:var(--mut)}.bar nav a:hover{color:var(--gold)}
.lang{display:flex;border:1px solid var(--line)}
.lang button{border:0;background:none;padding:.35rem .8rem;font:700 .8rem Oswald;cursor:pointer;color:var(--mut)}
.lang button[aria-pressed=true]{background:var(--gold);color:#111}
.hero{position:relative;max-width:1180px;margin:0 auto;padding:2.5rem 1.25rem 1rem;display:grid;gap:1rem;align-items:center}
.hero::before{content:"";position:absolute;inset:0 -100vw;background:repeating-linear-gradient(115deg,transparent 0 46px,rgba(255,180,0,.05) 46px 48px);pointer-events:none;z-index:-1}
.tagline{display:inline-flex;gap:.6rem;align-items:center;font:600 .9rem Oswald;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.tagline i{width:18px;height:3px;background:var(--hot);transform:skewX(-30deg)}
.hero h1{font-size:clamp(3rem,9vw,6.4rem);margin:.5rem 0 1rem;animation:slam .7s cubic-bezier(.2,.9,.2,1) both}
.hero h1 em{font-style:normal;color:transparent;-webkit-text-stroke:2px var(--gold)}
.hero p{color:#b9b9bf;max-width:30em;margin:0 0 1.6rem}
.cta{display:flex;flex-wrap:wrap;gap:.8rem}
.btn{display:inline-block;text-align:center;border:0;padding:.9rem 1.7rem;font:700 1rem Oswald;text-transform:uppercase;letter-spacing:.08em;background:var(--gold);color:#111;text-decoration:none;cursor:pointer;clip-path:var(--cut);transition:transform .15s,background .15s}
.btn:hover{transform:translateX(4px) skewX(-6deg);background:#ffc933}
.btn.out{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--gold);clip-path:none}.btn.out:hover{background:rgba(255,180,0,.12)}
.btn.wa{background:var(--wa);color:#05260f;width:100%;font-size:1.1rem;padding:1.05rem}.btn.wa:hover{background:#3fe37c}
/* scene: slab + tachometer */
.scene{position:relative;min-height:clamp(250px,46vw,400px);display:grid;place-items:center;cursor:pointer;padding:1rem 1rem 2rem}
.spot{position:relative;width:min(100%,540px);aspect-ratio:16/10;border-radius:30px;background:linear-gradient(160deg,#fff,#dcdce0);overflow:hidden;display:grid;place-items:center;box-shadow:0 0 0 1px #333,0 40px 70px -30px rgba(225,29,46,.6)}
.spot img{width:92%;mix-blend-mode:multiply;animation:reveal 1.5s cubic-bezier(.3,.8,.2,1) both,bob 3.2s 1.5s ease-in-out infinite}
.scan{position:absolute;top:0;bottom:0;width:3px;left:-5%;background:linear-gradient(transparent,#e11d2e,transparent);box-shadow:0 0 18px 4px rgba(225,29,46,.7);animation:scan 3.6s 1.4s ease-in-out infinite}
.plate{position:absolute;right:.4rem;bottom:.3rem;display:flex;align-items:stretch;background:#fff;color:#111;border:3px solid #111;border-radius:10px;overflow:hidden;font:800 1rem/1 Sora,sans-serif;text-decoration:none;direction:ltr;animation:drop .8s 1.2s cubic-bezier(.3,1.4,.4,1) both}
.plate b{background:#e11d2e;color:#fff;padding:.55rem .6rem}.plate span{padding:.55rem .7rem;letter-spacing:.04em}
.hint{position:absolute;left:.4rem;top:.4rem;z-index:3;font:600 .72rem Inter;color:var(--mut);background:#000;border:1px solid var(--line);border-radius:999px;padding:.2rem .75rem}
.scene.again *{animation:none!important}
@keyframes reveal{0%{clip-path:circle(0% at 30% 62%)}100%{clip-path:circle(150% at 30% 62%)}}
@keyframes scan{0%{left:-5%}55%,100%{left:105%}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes drop{0%{transform:translateY(-60px) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes slam{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:none}}
.marquee{overflow:hidden;background:var(--gold);color:#111;transform:skewY(-1.5deg);margin:2rem 0 1rem;direction:ltr}
#mq{display:flex;width:max-content;animation:mq 30s linear infinite}
#mq span{font:700 1.5rem Oswald;text-transform:uppercase;letter-spacing:.12em;padding:.35rem 1.5rem;white-space:nowrap}
#mq span::after{content:"//";margin-left:3rem;color:var(--hot)}
@keyframes mq{to{transform:translateX(-50%)}}
.wrap{max-width:1180px;margin:0 auto;padding:clamp(3rem,8vw,5rem) 1.25rem}
select,input:not([type=checkbox]){width:100%;padding:.85rem 1rem;font:inherit;border:1px solid var(--line);background:#0c0c0e;color:var(--ink)}
select:focus,input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(255,180,0,.2)}
.rv{opacity:0;transform:translateX(-34px) skewX(-5deg)}
.rv.in{opacity:1;transform:none;transition:opacity .6s var(--d,0ms),transform .6s var(--d,0ms)}
.chips{display:flex;gap:.5rem;overflow-x:auto;margin-bottom:1.6rem}
.chips button{flex:none;border:2px solid var(--line);background:none;color:var(--mut);padding:.4rem 1.2rem;font:600 .95rem Oswald;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;transform:skewX(-10deg);transition:.2s}
.chips button:hover{border-color:var(--gold);color:var(--gold)}
.chips button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#111}
.grid{display:grid;gap:1.4rem;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.car{background:var(--surf);border:1px solid var(--line);display:flex;flex-direction:column;position:relative;clip-path:var(--cut);transition:transform .25s,background .25s}
.car::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--gold);transform:scaleY(0);transform-origin:top;transition:transform .35s;z-index:3}
.car:hover{transform:translateY(-6px);background:var(--surf2)}.car:hover::before{transform:scaleY(1)}
.ph{position:relative;aspect-ratio:16/10;background:linear-gradient(160deg,#fff,#d9d9de);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain;padding:.6rem;mix-blend-mode:multiply;transition:transform .6s}.car:hover .ph img{transform:scale(1.08) translateX(10px)}
.tag{position:absolute;top:0;inset-inline-start:0;z-index:2;background:var(--gold);color:#111;padding:.15rem 1rem .15rem .8rem;font:700 .75rem Oswald;letter-spacing:.14em;text-transform:uppercase;clip-path:polygon(0 0,100% 0,88% 100%,0 100%)}
.body{padding:1.2rem 1.4rem 1.6rem;display:flex;flex-direction:column;gap:.8rem;flex:1}
.car h3{margin:0;font-size:1.6rem}
.specs{display:flex;flex-wrap:wrap;gap:.4rem}.specs span{border:1px solid var(--line);padding:.05rem .65rem;color:var(--mut);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
.price{margin-top:auto;padding-top:.8rem;border-top:1px solid var(--line)}.price strong{font:700 2.3rem Oswald;color:var(--gold)}.price small{color:var(--mut)}
.car .btn{width:100%}
.three{display:grid;gap:1.2rem;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.why{background:var(--surf);border:1px solid var(--line);padding:1.6rem;clip-path:var(--cut)}
.why b{display:block;font:700 3.6rem Oswald;color:transparent;-webkit-text-stroke:1.5px var(--gold);line-height:1;margin-bottom:.6rem}
.why h3{margin:0 0 .4rem;font-size:1.4rem}.why p{margin:0;color:var(--mut)}
#book{max-width:none;background:linear-gradient(rgba(8,8,10,.9),rgba(8,8,10,.96)),repeating-linear-gradient(115deg,#111 0 30px,#0b0b0d 30px 60px);border-block:1px solid var(--line)}
.form{max-width:660px;margin:0 auto;display:grid;gap:1.1rem;background:var(--surf);border-top:4px solid var(--gold);padding:clamp(1.25rem,4vw,2.2rem)}
.form h2{margin:0}.form label{display:grid;gap:.4rem;font:600 .85rem Oswald;text-transform:uppercase;letter-spacing:.08em;color:#cfcfd4}
.two{display:grid;gap:1.1rem;grid-template-columns:1fr 1fr}
.sum{margin:0;background:#0c0c0e;border:1px solid var(--line);padding:1rem 1.1rem;display:grid;gap:.4rem}
.sum div{display:flex;justify-content:space-between;gap:1rem}.sum dt{color:var(--mut)}.sum dd{margin:0;font-weight:600}
.sum .tot{border-top:1px solid var(--line);padding-top:.6rem;align-items:baseline}.tot dd{font:700 2.2rem Oswald;color:var(--gold)}
.err{color:#ff8a65;margin:0;font-weight:600}.small{margin:0;color:var(--mut);font-size:.83rem}
.cols{display:grid;gap:2.5rem}
.terms{display:grid;gap:.7rem;margin:0;padding-inline-start:1.2rem;color:var(--mut)}.terms li::marker{color:var(--gold)}.terms b{color:var(--ink)}
details{background:var(--surf);border-inline-start:3px solid var(--line);padding:.9rem 1.1rem;margin-bottom:.6rem}
summary{font:600 1.05rem Oswald;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}details[open]{border-color:var(--gold)}details[open] summary{color:var(--gold)}details p{margin:.6rem 0 0;color:var(--mut)}
.loc{display:flex;flex-wrap:wrap;gap:1.2rem 2rem;align-items:center;justify-content:space-between;padding:1.8rem;background:var(--surf);border-inline-start:6px solid var(--gold)}
.loc h2{margin:0;font-size:2.2rem}.loc h2::before{display:none}.loc p{margin:.3rem 0 0;color:var(--mut)}.acts{display:flex;flex-wrap:wrap;gap:.6rem}
.foot{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;justify-content:center;padding:2rem 1rem 6rem;border-top:1px solid var(--line);color:var(--mut);font-size:.9rem}.foot a:hover{color:var(--gold)}
.fab{position:fixed;right:1.1rem;bottom:1.1rem;z-index:30;width:58px;height:58px;border-radius:50%;background:var(--wa);display:grid;place-items:center;box-shadow:0 10px 26px -8px #000}
.fab svg{width:30px;height:30px;fill:#fff}
[dir=rtl] body,[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3,[dir=rtl] .brand,[dir=rtl] .btn,[dir=rtl] nav,[dir=rtl] .chips button,[dir=rtl] .tag,[dir=rtl] summary,[dir=rtl] .form label,[dir=rtl] .price strong,[dir=rtl] .tot dd,[dir=rtl] .why b,[dir=rtl] .hint,[dir=rtl] .tagline{font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;letter-spacing:0;text-transform:none}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3{line-height:1.25}
[dir=rtl] .tag{clip-path:polygon(0 0,100% 0,100% 100%,12% 100%)}
[dir=rtl] .chips button,[dir=rtl] .btn:hover{transform:none}
[dir=rtl] .rv{transform:translateX(34px) skewX(5deg)}[dir=rtl] .rv.in{transform:none}
@media(min-width:860px){.bar nav{display:flex}.hero{grid-template-columns:1fr 1.1fr;padding-top:3.5rem}.cols{grid-template-columns:1fr 1fr;gap:4rem}}
@media(max-width:520px){.two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,::before,::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

/* ---- BTM re-skin: rounded, red, sentence case ---- */
body{font-family:Inter,system-ui,sans-serif}
:root{--gold:#ff3a47;--red:#e11d2e;--cut:none}
h1,h2,h3,.brand{font-family:Sora,system-ui,sans-serif;text-transform:none;letter-spacing:-.02em;font-weight:800}
h2{font-size:clamp(1.9rem,5vw,2.8rem)}
h2::before{width:.38em;height:.38em;border-radius:50%;background:var(--red);transform:none;margin-inline-end:.4em}
.bar{border-bottom:1px solid var(--line)}.brand img{box-shadow:0 0 0 2px var(--red)}.brand b{color:var(--red)}
.bar nav{font:500 .92rem Inter;text-transform:none;letter-spacing:0}
.lang{border-radius:999px;overflow:hidden}.lang button{font-family:Inter}.lang button[aria-pressed=true]{background:var(--red);color:#fff}
.hero::before{display:none}.tagline{font:600 .8rem Inter;letter-spacing:.14em}.tagline i{width:6px;height:6px;border-radius:50%;background:var(--red);transform:none}
.hero h1{font-size:clamp(2.4rem,6vw,4.4rem);line-height:1.05}.hero h1 em{color:var(--red);-webkit-text-stroke:0}
.btn{clip-path:none;border-radius:999px;background:var(--red);color:#fff;font:700 .98rem Sora,sans-serif;text-transform:none;letter-spacing:0;padding:.9rem 1.6rem}
.btn:hover{transform:translateY(-2px);background:#f0273a;box-shadow:0 14px 28px -12px rgba(225,29,46,.8)}
.btn.out{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px #3a3a40}.btn.out:hover{background:#1a1a1d;box-shadow:inset 0 0 0 1.5px var(--red)}
.marquee{background:var(--red);color:#fff;transform:none;margin:2rem 0 0}#mq span{font:700 1.1rem Sora,sans-serif;text-transform:none;letter-spacing:.04em}#mq span::after{color:#fff;opacity:.6}
select,input:not([type=checkbox]){border-radius:12px}
.chips button{transform:none;border-radius:999px;border-width:1px;font:600 .88rem Inter;text-transform:none;letter-spacing:0}.chips button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}.chips button:hover{border-color:var(--red);color:#fff}
.car,.why{clip-path:none;border-radius:22px;overflow:hidden}
.car::before{display:none}.car:hover{transform:translateY(-6px);box-shadow:0 26px 44px -28px rgba(225,29,46,.55)}
.tag{background:var(--red);color:#fff;clip-path:none;border-radius:0 0 16px 0;font:700 .7rem Inter;letter-spacing:.1em}
[dir=rtl] .tag{clip-path:none;border-radius:0 0 0 16px}
.car h3{font-size:1.4rem}.specs span{border-radius:999px;text-transform:none;letter-spacing:0}
.price strong{font:800 1.9rem Sora,sans-serif;color:var(--red)}
.why b{font:800 2.8rem Sora,sans-serif;-webkit-text-stroke:0;color:var(--red);opacity:.9}.why h3{font-size:1.25rem}
#book{background:linear-gradient(180deg,#0e0e10,#17080a)}
.form{border-radius:24px;border-top:3px solid var(--red)}
.form label{font:600 .86rem Inter;text-transform:none;letter-spacing:0;color:#d9d9de}
.tot dd{font:800 2rem Sora,sans-serif;color:var(--red)}
details{border-radius:14px;border-inline-start:0;border:1px solid var(--line)}summary{font:600 1rem Sora,sans-serif;text-transform:none;letter-spacing:0}details[open]{border-color:var(--red)}details[open] summary{color:var(--gold)}
.loc{border-radius:22px;border-inline-start:6px solid var(--red)}.loc h2{font-size:1.8rem}
.terms li::marker{color:var(--red)}
.foot a:hover{color:var(--gold)}
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="#top"><img src="images/logo.png" alt="" onerror="this.remove()"><span>BTM <b>DRIVE</b></span></a>
  <nav><a href="#fleet" data-t="nav_fleet"></a><a href="#why" data-t="nav_why"></a><a href="#book" data-t="nav_book"></a><a href="#faq" data-t="nav_faq"></a><a href="#where" data-t="nav_loc"></a></nav>
  <div class="lang" id="lang" role="group" aria-label="Langue"></div>
</header>

<main id="top">
  <section class="hero">
    <div>
      <span class="tagline"><span data-t="w1"></span><i></i><span data-t="w2"></span><i></i><span data-t="w3"></span></span>
      <h1 data-t="h1"></h1>
      <p data-t="sub"></p>
      <div class="cta"><a class="btn" href="#fleet" data-t="cta1"></a><a class="btn out" href="#book" data-t="cta2"></a></div>
    </div>
    <!-- Animated scene: the car drives in, road keeps moving. Click to replay. -->
    <div class="scene" id="scene" role="img" aria-label="Cupra Leon">
      <div class="spot"><img src="images/leon-cupra.png" alt="Cupra Leon"><span class="scan"></span></div>
      <a class="plate" href="tel:+212690920202"><b>BTM</b><span>06 90 92 02 02</span></a>
      <span class="hint" data-t="replay"></span>
    </div>
  </section>

  <div class="marquee" aria-hidden="true"><div id="mq"></div></div>

  <section id="fleet" class="wrap">
    <h2 class="rv" data-t="fleet_t"></h2>
    <p class="sub" data-t="fleet_p"></p>
    <div class="chips" id="chips" role="group" aria-label="Catégorie"></div>
    <div class="grid" id="cars"></div>
  </section>

  <section id="why" class="wrap" style="padding-top:0">
    <h2 class="rv" data-t="why_t"></h2>
    <div class="three">
      <div class="why rv"><b>1</b><h3 data-t="w1"></h3><p data-t="w1p"></p></div>
      <div class="why rv" style="--d:100ms"><b>2</b><h3 data-t="w2"></h3><p data-t="w2p"></p></div>
      <div class="why rv" style="--d:200ms"><b>3</b><h3 data-t="w3"></h3><p data-t="w3p"></p></div>
    </div>
  </section>

  <section id="book" class="wrap">
    <form id="form" class="form rv" novalidate>
      <h2 data-t="form_t"></h2>
      <label><span data-t="name"></span><input name="name" required autocomplete="name"></label>
      <label><span data-t="phone"></span><input name="phone" type="tel" required inputmode="tel" autocomplete="tel" placeholder="+212 6…"></label>
      <label><span data-t="pickup"></span><select name="loc" id="loc" required></select></label>
      <div class="two">
        <label><span data-t="from"></span><input name="from" id="from" type="date" required></label>
        <label><span data-t="to"></span><input name="to" id="to" type="date" required></label>
      </div>
      <label><span data-t="car"></span><select name="car" id="car" required></select></label>
      <dl class="sum" aria-live="polite">
        <div><dt data-t="days"></dt><dd id="sDays">—</dd></div>
        <div class="tot"><dt data-t="total"></dt><dd id="sTotal">—</dd></div>
      </dl>
      <p class="err" id="err" role="alert" hidden></p>
      <button class="btn wa" type="submit" data-t="send"></button>
      <p class="small" data-t="note"></p>
    </form>
  </section>

  <section id="faq" class="wrap cols">
    <div class="rv"><h2 data-t="terms_t"></h2><ul class="terms" id="terms"></ul></div>
    <div class="rv"><h2>FAQ</h2><div id="faqList"></div></div>
  </section>

  <section id="where" class="wrap" style="padding-top:0">
    <div class="loc rv">
      <div><h2 data-t="loc_t"></h2><p data-t="loc_p"></p></div>
      <div class="acts"><a class="btn" id="mapBtn" target="_blank" rel="noopener" data-t="map"></a><a class="btn out" href="tel:+212690920202">+212 690 920 202</a></div>
    </div>
  </section>
</main>

<footer class="foot">
  <span>© 2026 BTM DRIVE</span><span data-t="footer"></span>
  <a href="tel:+212690920202">+212 690 920 202</a>
  <a href="https://wa.me/212690920202" target="_blank" rel="noopener">WhatsApp</a>

const $ = s => document.querySelector(s);

function applyLang() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(e => { const v = t(e.dataset.t); e.dataset.t === 'h1' ? e.innerHTML = v : e.textContent = v; });
  $('#lang').innerHTML = ['fr', 'en', 'ar'].map(l => `<button type="button" data-l="${l}" aria-pressed="${l === lang}">${l.toUpperCase()}</button>`).join('');
  const r = C.rules;
  $('#terms').innerHTML = [1, 2, 3, 4].map(i => `<li>${t('t' + i, { min: r.minAge, y: r.years, dep: t('dep') })}</li>`).join('');
  $('#faqList').innerHTML = T[lang].q.map(q => `<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('');
  const kl = $('#loc').value, kc = $('#car').value;
  $('#loc').innerHTML = C.locs.map(l => `<option value="${l.id}">${l[lang]}</option>`).join('');
  if (kl) $('#loc').value = kl;
  $('#car').innerHTML = `<option value="">${t('choose')}</option>` + C.cars.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  if (kc) $('#car').value = kc;
  const cats = ['all', ...new Set(C.cars.map(c => c.cat))];
  $('#chips').innerHTML = cats.map(k => `<button type="button" data-c="${k}" aria-pressed="${k === cat}">${t(k === 'all' ? 'f_all' : k)}</button>`).join('');
  renderCars(); calc(); observe();
}
function renderCars() {
  $('#cars').innerHTML = C.cars.filter(c => cat === 'all' || c.cat === cat).map((c, i) => `

      <div class="ph"><span class="tag">${t(c.cat)}</span><img src="${c.img || FALLBACK}" alt="${c.name}" loading="lazy" onerror="this.onerror=null;this.src=FALLBACK"></div>
      <div class="body"><h3>${c.name}</h3>
        <div class="specs"><span>${t(c.gb)}</span><span>${t(c.fuel)}</span><span>${t('seats', { n: c.seats })}</span><span>${t('ac')}</span></div>
        <div class="price"><strong>${money(c.price)}</strong> <small>${t('per_day')}</small></div>
        <button class="btn" type="button" data-book="${c.id}">${t('book')}</button></div></article>`).join('');
}
function calc() {
  const n = nDays(), car = carOf($('#car').value), ok = n > 0 && car;
  $('#sDays').textContent = n > 0 ? t('days_n', { n }) : '—';
  $('#sTotal').textContent = ok ? money(car.price * n) : '—';
  return ok ? { n, car, total: car.price * n } : null;
}
document.addEventListener('click', e => {

  if (c) { cat = c.dataset.c; applyLang(); }
  if (b) { $('#car').value = b.dataset.book; calc(); $('#book').scrollIntoView(); }
});
['#loc', '#car', '#from', '#to'].forEach(s => $(s).addEventListener('change', () => { if (s === '#from') $('#to').min = $('#from').value; $('#err').hidden = true; calc(); }));
$('#form').addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target; if (!f.reportValidity()) return;
  const r = calc(); if (!r) { $('#err').textContent = t('err'); $('#err').hidden = false; return; }

  const msg = [`*BTM DRIVE* — ${t('w_head')}`, '', `${t('w_car')}: ${r.car.name}`, `${t('w_pick')}: ${loc[lang]}`, `${t('w_dates')}: ${d(fd.from)} → ${d(fd.to)}`,
    `${t('w_days')}: ${t('days_n', { n: r.n })}`, `${t('w_total')}: ${money(r.total)}`, '', `${t('w_client')}: ${fd.name.trim()}`, `${t('w_tel')}: ${fd.phone.trim()}`].join('\n');
  window.open(`https://wa.me/${C.wa}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
});
// replay the driving animation on click
$('#scene').addEventListener('click', () => {
  const s = $('#scene'); s.classList.add('again'); void s.offsetWidth; s.classList.remove('again');
});
let io;
function observe() {
  io = io || new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }), { threshold: .12 });
  document.querySelectorAll('.rv:not(.in)').forEach(el => io.observe(el));
}
$('#mapBtn').href = C.map;
$('#mq').innerHTML = Array(10).fill('<span>BTM DRIVE</span><span>Location de voiture</span>').join('');
const today = new Date().toISOString().split('T')[0]; $('#from').min = today; $('#to').min = today;
